<!-- Vela Nox custom code element. Place: Subscriber portal, "Already sent" lesson. Renders the H1. Self-contained: includes the shared script. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Vela Nox: shared styles for the custom code elements.
   Always night. Two kinds of light: cold ice-blue is Vela, the machine
   (buttons, links, focus, the glow on titles); warm sodium orange is people
   (map lights, waveform markers, contributors' names, the confirmation light).
   Red is only the live deadline. Radius 0, sentence case, no monospace. */
:root {
  --night: #070C16;     /* Tower Night: page background, near-black navy */
  --deep: #0D1624;      /* Deep Water: raised surfaces, map sea */
  --concrete: #243048;  /* Wet Concrete: borders, inputs, map land */
  --fog: #8E9AAE;       /* Sea Fog: secondary text */
  --mist: #E6EDF5;      /* Mist: primary text and headings */
  --ice: #A6DCFF;       /* Ice Signal: Vela's light. Buttons, links on hover, focus */
  --ice-hover: #C9ECFF;
  --ice-glow: rgba(166, 220, 255, 0.32);
  --sodium: #F2A14E;    /* Sodium Lamp: people. Map lights, markers, contributor names */
  --beacon: #E5483D;    /* Tower Beacon: the live submission deadline only */

  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --text: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;

  --t-hero: 44px; --t-hero-lh: 0.95;
  --t-h1: 36px; --t-h1-lh: 1;
  --t-h2: 26px;
  --t-h3: 19px;
  --t-body: 17px;
  --t-small: 14px;
  --t-theme: 34px;
  --read: 38rem;
  --page: 72rem;
  color-scheme: dark;
}
@media (min-width: 900px) {
  :root { --t-hero: 88px; --t-hero-lh: 0.92; --t-h1: 60px; --t-h1-lh: 0.98; --t-h2: 36px; --t-h3: 21px; --t-body: 18px; --t-small: 15px; --t-theme: 56px; }
}

.vn { color: var(--mist); font-family: var(--text); font-size: var(--t-body); line-height: 1.6; box-sizing: border-box; }
.vn *, .vn *::before, .vn *::after { box-sizing: inherit; }
.vn [hidden] { display: none !important; }
.vn a { color: var(--mist); text-decoration: underline; text-decoration-color: var(--fog); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.vn a:hover, .vn a:focus-visible { color: var(--ice); text-decoration-color: var(--ice); }
.vn :focus-visible { outline: 3px solid var(--ice); outline-offset: 3px; }
.vn h1, .vn h2 { font-family: var(--display); color: var(--mist); text-wrap: balance; margin: 0 0 0.4em; }
.vn h1 { font-weight: 800; font-size: var(--t-h1); line-height: var(--t-h1-lh); text-shadow: 0 0 36px var(--ice-glow); }
.vn h2 { font-weight: 600; font-size: var(--t-h2); line-height: 1.05; }
.vn h3 { font-family: var(--text); font-weight: 700; font-size: var(--t-h3); line-height: 1.3; color: var(--mist); margin: 0 0 0.3em; }
.vn p { margin: 0 0 0.8em; }
.vn-fog, .vn-meta { color: var(--fog); }
.vn-meta { font-size: var(--t-small); }
.vn-small { font-size: var(--t-small); }
.vn-num, .vn-ts { font-variant-numeric: tabular-nums; }
.vn-read { max-width: var(--read); }
.vn-empty { color: var(--fog); padding: 1.25rem 0; }

/* Buttons */
.vn-btn { display: inline-block; background: var(--ice); box-shadow: 0 0 28px var(--ice-glow); color: var(--night) !important; text-decoration: none !important; font-family: var(--text); font-weight: 700; font-size: 17px; line-height: 1.2; padding: 18px 28px; border: 0; border-radius: 0; cursor: pointer; }
.vn-btn:hover { background: var(--ice-hover); color: var(--night) !important; box-shadow: 0 0 40px var(--ice-glow); }
.vn-btn:active { transform: translateY(1px); }
.vn-btn:focus-visible { outline: 3px solid var(--mist); outline-offset: 3px; }
.vn-btn-2 { display: inline-block; background: transparent; color: var(--mist) !important; text-decoration: none !important; font-family: var(--text); font-weight: 700; font-size: 16px; padding: 14px 22px; border: 1px solid var(--concrete); border-radius: 0; cursor: pointer; }
.vn-btn-2:hover { border-color: var(--ice); color: var(--mist) !important; box-shadow: 0 0 20px var(--ice-glow); }
@media (max-width: 599px) { .vn-btn { display: block; width: 100%; text-align: center; } }

/* Status dot: beacon and pulsing while submissions are open, fog and still when closed */
.vn-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--fog); margin-right: 0.6rem; vertical-align: 1px; flex: none; }
.vn-dot.is-live { background: var(--beacon); animation: vn-pulse 2.4s ease-in-out infinite; }
@keyframes vn-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

/* Theme strip (Home and Submit) */
.vn-strip { background: linear-gradient(180deg, rgba(166, 220, 255, 0.05), transparent 60%), var(--deep); border: 1px solid var(--concrete); padding: 32px; display: grid; gap: 0.9rem; }
@media (max-width: 599px) { .vn-strip { padding: 24px 20px; } }
.vn-strip-k { font-size: 15px; color: var(--fog); }
.vn-strip-theme { font-family: var(--display); font-weight: 800; font-size: var(--t-theme); line-height: 1; color: var(--mist); margin: 0; text-wrap: balance; text-shadow: 0 0 32px var(--ice-glow); }
.vn-strip-status { display: flex; align-items: baseline; color: var(--mist); }
.vn-strip-status.is-live { color: var(--beacon); font-size: 18px; }
.vn-strip-vote { color: var(--fog); margin: 0; }

/* How a week works: vertical timeline */
.vn-timeline { list-style: none; margin: 0; padding: 0; max-width: var(--read); }
.vn-timeline li { position: relative; display: grid; grid-template-columns: 4.5rem 1fr; gap: 0 1.25rem; padding-bottom: 1.75rem; }
.vn-timeline li::before { content: ""; position: absolute; left: 1.1rem; top: 2.4rem; bottom: 0.3rem; width: 1px; background: var(--concrete); }
.vn-timeline li:last-child::before { display: none; }
.vn-timeline .day { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.2; color: var(--mist); position: relative; }
.vn-timeline .here { position: absolute; left: calc(1.1rem - 4px); top: 2.55rem; width: 9px; height: 9px; border-radius: 50%; background: var(--ice); box-shadow: 0 0 12px var(--ice); }
.vn-timeline p { margin: 0.25rem 0 0; }

/* Counters */
.vn-counters { display: flex; flex-wrap: wrap; gap: 0.5rem 2rem; margin: 0 0 1.25rem; }
.vn-counter { display: flex; align-items: baseline; gap: 0.5rem; color: var(--fog); }
.vn-counter b { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; color: var(--mist); font-variant-numeric: tabular-nums; }

/* Map */
.vn-map-wrap { position: relative; background: var(--deep); overflow: hidden; }
.vn-map-wrap svg { display: block; width: 100%; height: 100%; }
.vn-map-wrap.is-framed { border: 1px solid var(--concrete); }
.vn-map-wrap.is-full { height: 70vh; min-height: 420px; }
@media (max-width: 599px) { .vn-map-wrap.is-full { height: 55vh; min-height: 320px; } }
.vn-map-msg { position: absolute; left: 20px; right: 20px; top: 45%; color: var(--fog); max-width: 30rem; }
.vn-pt { cursor: pointer; }
.vn-pt:focus { outline: none; }
.vn-pt:focus-visible .vn-pt-ring { stroke: var(--ice); stroke-width: 2; }
.vn-pt.is-in { transition: opacity 0.6s ease-out; }
.vn-bleed { width: 100vw; position: relative; left: 50%; margin-left: -50vw; }
.vn-filters { display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; margin: 0 0 1rem; }
.vn-filter { background: none; border: 0; padding: 0.5rem 0; min-height: 44px; font: inherit; color: var(--fog); cursor: pointer; border-bottom: 2px solid transparent; }
.vn-filter[aria-pressed="true"] { color: var(--mist); border-bottom-color: var(--ice); }
.vn-filter:hover { color: var(--mist); }
.vn-pop { position: absolute; z-index: 5; width: min(260px, calc(100% - 16px)); background: var(--deep); border: 1px solid var(--concrete); padding: 0.9rem 1rem; font-size: var(--t-small); }
.vn-pop-row + .vn-pop-row { border-top: 1px solid var(--concrete); margin-top: 0.7rem; padding-top: 0.7rem; }
.vn-pop b { color: var(--mist); font-size: 16px; }
.vn-pop-close { position: absolute; top: 0; right: 0; width: 44px; height: 44px; background: none; border: 0; color: var(--mist); cursor: pointer; }
.vn-pop-close svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.5; }
.vn-legend { display: flex; flex-wrap: wrap; gap: 0.5rem 1.75rem; margin-top: 1rem; font-size: var(--t-small); color: var(--fog); }
.vn-legend span { display: inline-flex; align-items: center; gap: 0.5rem; }
.vn-list-toggle { margin-top: 1rem; }
.vn-table-wrap { overflow-x: auto; margin-top: 1rem; }
.vn-table { border-collapse: collapse; min-width: 100%; font-size: var(--t-small); }
.vn-table th, .vn-table td { text-align: left; padding: 0.55rem 1.5rem 0.55rem 0; border-bottom: 1px solid var(--concrete); }
.vn-table th { color: var(--fog); font-weight: 400; }
.vn-table td { font-variant-numeric: tabular-nums; }

/* Level meter: four horizontal signal bars */
.vn-meter { display: inline-flex; gap: 3px; align-items: center; vertical-align: middle; }
.vn-meter i { display: block; width: 8px; height: 12px; background: var(--concrete); }
.vn-meter i.on { background: var(--sodium); }
.vn-level { display: inline-flex; align-items: center; gap: 0.6rem; }

/* Contributor cards */
.vn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.25rem; }
.vn-card { background: var(--deep); border: 1px solid var(--concrete); padding: 1.25rem; min-width: 0; }
.vn-card.is-target { border-color: var(--ice); box-shadow: 0 0 24px var(--ice-glow); }
.vn-card-name { font-family: var(--text); font-weight: 700; font-size: var(--t-h3); color: var(--sodium); margin: 0; overflow-wrap: anywhere; }
.vn-card-city { color: var(--fog); margin: 0 0 1rem; }
.vn-card-stats { margin: 0.9rem 0; font-variant-numeric: tabular-nums; }
.vn-card-tracks { list-style: none; margin: 0; padding: 0; font-size: var(--t-small); display: grid; gap: 0.35rem; }
.vn-card-tracks li { display: grid; grid-template-columns: 5.5rem 1fr; gap: 0.5rem; font-variant-numeric: tabular-nums; }

/* Tracks index: plain rows */
.vn-rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--concrete); }
.vn-row { display: grid; grid-template-columns: 96px 1fr; gap: 1.25rem; align-items: center; padding: 1.1rem 0; border-bottom: 1px solid var(--concrete); text-decoration: none !important; }
.vn-row img, .vn-cover-ph { width: 96px; height: 96px; object-fit: cover; display: block; background: var(--deep); border: 1px solid var(--concrete); }
.vn-row-title { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.05; color: var(--mist); margin: 0 0 0.3rem; }
.vn-row:hover .vn-row-title, .vn-row:focus-visible .vn-row-title { color: var(--mist); text-decoration: underline; text-decoration-color: var(--ice); text-underline-offset: 4px; }
.vn-row .vn-meta { margin: 0; }
.vn-row .vn-count { color: var(--mist); font-size: var(--t-small); margin: 0.2rem 0 0; font-variant-numeric: tabular-nums; }

/* Track page */
.vn-track-head { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.5rem; margin-bottom: 3rem; }
@media (min-width: 700px) { .vn-track-head { grid-template-columns: minmax(0, 1fr) 240px; align-items: end; } }
.vn-track-head img, .vn-track-head .vn-cover-ph { width: 100%; max-width: 240px; height: auto; aspect-ratio: 1; }
.vn-track-no { color: var(--fog); margin: 0 0 0.4rem; }
.vn-links { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.25rem; }
.vn-section { margin: 0 0 4rem; }
.vn-wave-scroll { overflow-x: auto; }
.vn-wave { position: relative; min-width: 560px; padding-bottom: 34px; }
.vn-wave svg { display: block; width: 100%; height: 120px; }
@media (max-width: 599px) { .vn-wave svg { height: 80px; } }
.vn-bar { fill: var(--concrete); transition: fill 0.2s; }
.vn-bar.is-lit { fill: var(--ice); }
.vn-mark { position: absolute; bottom: 0; width: 44px; height: 44px; margin-left: -22px; background: none; border: 0; padding: 0; cursor: pointer; }
.vn-mark::before { content: ""; position: absolute; left: 21.5px; bottom: 27px; height: 34px; width: 1px; background: var(--sodium); }
.vn-mark::after { content: ""; position: absolute; left: 17px; bottom: 17px; width: 10px; height: 10px; border-radius: 50%; background: var(--sodium); }
.vn-mark:focus-visible { outline: none; }
.vn-mark::after { box-shadow: 0 0 8px var(--sodium); }
.vn-mark:focus-visible::after { box-shadow: 0 0 0 3px var(--night), 0 0 0 5px var(--ice); }
.vn-tip { position: absolute; top: 0; transform: translate(-50%, calc(-100% - 8px)); background: var(--deep); border: 1px solid var(--concrete); padding: 0.45rem 0.7rem; font-size: var(--t-small); color: var(--mist); white-space: nowrap; pointer-events: none; z-index: 4; font-variant-numeric: tabular-nums; }
.vn-credits { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--concrete); max-width: var(--read); }
.vn-credits li { display: grid; grid-template-columns: 3.5rem 1fr; gap: 1rem; padding: 0.7rem 0.5rem; border-bottom: 1px solid var(--concrete); transition: background 0.2s; }
.vn-credits li.is-lit { background: var(--deep); }
.vn-credits .vn-ts { color: var(--mist); }
.vn-credits .vn-fog { color: var(--fog); }
.vn-stream-credits { max-width: var(--read); }

/* Submit */
.vn-theme-h { margin: 0; }
.vn-theme-h .k { display: block; font-family: var(--text); font-weight: 400; font-size: 15px; line-height: 1.4; color: var(--fog); margin-bottom: 0.9rem; }
.vn-theme-h .v { display: block; font-family: var(--display); font-weight: 800; font-size: var(--t-theme); line-height: 1; color: var(--mist); }
.vn-reminder { color: var(--mist); margin: 1.5rem 0 0.4rem; }
.vn-form-frame { margin-top: 2.5rem; }
.vn-form-frame iframe { width: 100%; border: 0; min-height: 1100px; background: transparent; }

/* Confirmation: the one centred moment */
.vn-confirm { text-align: center; padding: 3rem 0 4rem; position: relative; }
.vn-confirm-signal { position: relative; width: 12px; height: 160px; margin: 0 auto 2rem; }
.vn-confirm-signal i { position: absolute; left: 1px; bottom: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--sodium); box-shadow: 0 0 14px var(--sodium); }
.vn-confirm-signal b { position: absolute; left: 5.5px; bottom: 10px; width: 1px; height: 150px; background: var(--sodium); transform-origin: bottom; animation: vn-rise 1.2s ease-out both; }
@keyframes vn-rise { from { transform: scaleY(0); opacity: 1; } 80% { opacity: 1; } to { transform: scaleY(1); opacity: 0.25; } }
.vn-confirm h1 { max-width: 16em; margin: 0 auto 0.6em; font-size: var(--t-h2); line-height: 1.05; }
.vn-confirm p { color: var(--fog); }

@media (prefers-reduced-motion: reduce) {
  .vn-dot.is-live { animation: none; }
  .vn-confirm-signal b { animation: none; opacity: 0.4; }
  .vn-pt.is-in, .vn-bar, .vn-credits li { transition: none; }
}

/* Every page, including funnel, checkout and portal pages: always night, never a white flash */
html, body { background: var(--night) !important; color: var(--mist); font-family: var(--text); }
</style>
<script>
/* One-time setup: fill these three in. Weekly changes go in the Google Sheet Settings tab, not here. */
window.VELA_CONFIG = {
  dataUrl: 'PASTE_APPS_SCRIPT_WEB_APP_URL',   // ends in /exec
  subscribeUrl: '/subscribe',                 // page with the Stripe checkout
  portalUrl: 'PASTE_CLIENT_PORTAL_LOGIN_URL'
};
/* Vela Nox: shared script for the GoHighLevel custom code elements.
 *
 * Loaded once per page (Website settings -> Head tracking code, see ghl/site-head.html).
 * Every custom code element on the site calls one VELA.render.* function.
 *
 * Weekly edits never happen here. Theme, week number and submission status live in
 * the Google Sheet "Settings" tab and reach every page through the data endpoint.
 * The only values set here are one-time setup values (URLs) and the fixed launch dates.
 */
(function () {
  'use strict';
  if (window.VELA) return;

  var C = {
    // Apps Script web app URL (ends in /exec). See apps-script/Code.gs.
    dataUrl: '',
    // GoHighLevel page that holds the Stripe checkout for the weekly subscription.
    subscribeUrl: '/subscribe',
    // GoHighLevel client portal login (where the Submit lesson lives).
    portalUrl: '',
    paths: {
      home: '/', submit: '/submit', map: '/signal-map', tracks: '/tracks', track: '/track',
      contributors: '/contributors', rules: '/rules-faq', terms: '/terms', cancellation: '/cancellation'
    },
    // Launch week. Fixed dates, all Eastern Time. The site switches to the regular cycle at regularStart.
    launch: {
      theme: "The room you're in right now",
      open: '2026-09-30T00:00:00',
      close: '2026-10-08T23:59:59',
      regularStart: '2026-10-12T00:00:00',
      firstEmail: '2026-10-12'
    },
    cacheSeconds: 300
  };
  var over = window.VELA_CONFIG || {};
  Object.keys(over).forEach(function (k) {
    if (k === 'paths' || k === 'launch') Object.assign(C[k], over[k]); else C[k] = over[k];
  });

  var CTA = 'Send me a sound — $3/week';
  var LEVELS = ['Static', 'Signal', 'Frequency', 'Broadcast'];
  var MSG_ERROR = 'The signal isn’t coming through right now. Try again in a minute.';

  /* ---------- small helpers ---------- */
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : ''; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function trackNo(n) { return 'Track ' + pad2(Number(n)); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function levelIndex(name) { var i = LEVELS.indexOf(name); return i < 0 ? 0 : i; }
  function trackUrl(n, c) { return C.paths.track + '?n=' + encodeURIComponent(n) + (c ? '&c=' + encodeURIComponent(c) : ''); }
  function profileUrl(slug) { return C.paths.contributors + '#c-' + encodeURIComponent(slug); }

  /* ---------- Eastern Time ---------- */
  var etFmt = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23', weekday: 'short'
  });
  function et(d) {
    var p = {};
    etFmt.formatToParts(d || (C.now ? new Date(C.now) : new Date())).forEach(function (x) { p[x.type] = x.value; });
    var date = p.year + '-' + p.month + '-' + p.day;
    return { date: date, iso: date + 'T' + p.hour + ':' + p.minute + ':' + p.second,
      wd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(p.weekday) };
  }
  function utcDate(s) { var a = s.split('-'); return new Date(Date.UTC(+a[0], +a[1] - 1, +a[2])); }
  function addDays(s, n) { var d = utcDate(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function weekday(s) { return utcDate(s).getUTCDay(); }
  function longDate(s, withYear) {
    var o = { timeZone: 'UTC', weekday: 'long', month: 'long', day: 'numeric' };
    if (withYear) o.year = 'numeric';
    return utcDate(s).toLocaleDateString('en-US', o);
  }

  /* The week, as the site should describe it right now. */
  function schedule(settings, now) {
    var s = settings || {}, L = C.launch, t = et(now), w = t.iso;
    var launch = w < L.regularStart;
    var phase;
    if (launch) phase = w < L.open ? 'before' : (w <= L.close ? 'open' : 'making');
    else phase = (t.wd >= 2 && t.wd <= 4) ? 'open' : (t.wd === 1 ? 'monday' : 'making');
    var ov = String(s.status_override || 'auto').trim().toLowerCase();
    if (ov === 'open') phase = 'open';
    else if (ov === 'closed') phase = 'closed';

    var nextOpen = null;
    if (phase === 'before') nextOpen = longDate(L.open.slice(0, 10)) + ', 12:00 am ET';
    else if (phase === 'making' || phase === 'monday') {
      var d = t.date;
      do { d = addDays(d, 1); } while (weekday(d) !== 2);
      nextOpen = longDate(d) + ', 12:00 am ET';
    }

    var dl = String(s.deadline_override || '').trim();
    var r = {
      launch: launch, phase: phase, open: phase === 'open', nextOpen: nextOpen,
      theme: String(s.theme || '').trim() || L.theme,
      themeNote: String(s.theme_note || '').trim(),
      week: s.current_week || ''
    };
    r.stripStatus = {
      open: dl ? 'Submissions open until ' + dl : (launch ? 'Submissions open until Thursday, October 8, 11:59 pm ET' : 'Submissions open until Thursday, 11:59 pm ET'),
      making: 'Submissions closed — the track is being made',
      monday: 'Submissions closed. They open ' + nextOpen,
      before: 'Submissions open ' + nextOpen,
      closed: 'Submissions closed for now'
    }[phase];
    r.submitDeadline = dl ? 'Closes ' + dl : (launch ? 'Closes Thursday, October 8, 11:59 pm ET' : 'Closes Thursday, 11:59 pm ET');
    r.voteStrip = 'Next week’s theme is being voted on now, in Vela’s Close Friends story.' +
      (launch ? ' The vote closes Sunday, October 11, 11:59 pm ET.' : '');
    r.voteSubmit = launch
      ? 'Want a say in next week’s theme? The vote is open until Sunday, October 11, 11:59 pm ET, in Vela’s Close Friends story.'
      : 'Want a say in next week’s theme? The vote is open all week in Vela’s Close Friends story.';
    r.confirmation = 'Got it. Your sound is in the pool for ' + r.theme + '. The track lands in your inbox on Monday' +
      (launch ? ', October 12.' : '.');
    return r;
  }

  /* ---------- data ---------- */
  var dataPromise = null;
  function data() {
    if (dataPromise) return dataPromise;
    // C.data: inline data, used only by the local preview page

    return new Promise(function (ok) {
      var a = new Audio(); a.preload = 'metadata';
      a.onloadedmetadata = function () { ok(isFinite(a.duration) ? { d: a.duration, p: null } : null); };
      a.onerror = function () { ok(null); };
      a.src = url;
    });
  }
  function waveformData(w) {
    var pk = parsePeaks(w);
    if (pk) return Promise.resolve(pk);
    var url = safeUrl(w);
    if (!url) return Promise.resolve(null);
    return peaksFromAudio(url).catch(function () { return durationFromAudio(url); });
  }
  function creditLine(c) { return [c.sound, c.name, c.city, c.t].filter(Boolean).join(' · '); }

  // Waveform credits: thin concrete bars, sodium markers under them at each timestamp.
  // Hover, focus or tap a marker: nearby bars brighten, the panel shows the credit, its row lights up.
  function drawWave(el, wf, credits, rows, preselect) {
    var n = wf.p ? wf.p.length : 200, bw = 1000 / n, bars = '';
    for (var i = 0; i < n; i++) {
      var v = wf.p ? wf.p[i] : 0.02, h = Math.max(1.5, v * 110);
      bars += '<rect class="vn-bar" x="' + (i * bw).toFixed(2) + '" y="' + (60 - h / 2).toFixed(1) + '" width="' + Math.max(bw * 0.55, 0.6).toFixed(2) + '" height="' + h.toFixed(1) + '"/>';
    }
    var marks = credits.map(function (c, i) {
      if (!c.slug || !isFinite(c.s) || c.s > wf.d) return '';
      return '<button type="button" class="vn-mark" data-i="' + i + '" style="left:' + (c.s / wf.d * 100).toFixed(3) + '%" aria-label="' + esc(creditLine(c)) + '"></button>';
    }).join('');
    el.innerHTML = '<div class="vn-wave-scroll"><div class="vn-wave"><svg viewBox="0 0 1000 120" preserveAspectRatio="none" aria-hidden="true">' + bars + '</svg>' + marks + '</div></div>';
    var wave = el.querySelector('.vn-wave'), rects = wave.querySelectorAll('.vn-bar'), tip = null, lit = [];
    function clear() {
      if (tip) { tip.remove(); tip = null; }
      lit.forEach(function (x) { x.classList.remove('is-lit'); }); lit = [];
    }
    function show(b) {
      clear();
      var c = credits[+b.getAttribute('data-i')], centre = Math.round(c.s / wf.d * n), span = Math.max(2, Math.round(n / 100));
      for (var j = centre - span; j <= centre + span; j++) if (rects[j]) { rects[j].classList.add('is-lit'); lit.push(rects[j]); }
      var row = rows && rows.querySelector('[data-i="' + b.getAttribute('data-i') + '"]');
      if (row) { row.classList.add('is-lit'); lit.push(row); }
      tip = document.createElement('div'); tip.className = 'vn-tip'; tip.textContent = creditLine(c);
      wave.appendChild(tip);
      var half = tip.offsetWidth / 2, x = b.offsetLeft;
      tip.style.left = Math.min(Math.max(x, half + 2), wave.clientWidth - half - 2) + 'px';
    }
    Array.prototype.forEach.call(wave.querySelectorAll('.vn-mark'), function (b) {
      b.addEventListener('mouseenter', function () { show(b); });
      b.addEventListener('focus', function () { show(b); });
      b.addEventListener('click', function () { show(b); });
      b.addEventListener('mouseleave', function () { if (document.activeElement !== b) clear(); });
      b.addEventListener('blur', clear);
    });
    if (preselect) {
      var idx = credits.map(function (c) { return c.slug; }).indexOf(preselect);
      var pre = idx >= 0 && wave.querySelector('.vn-mark[data-i="' + idx + '"]');
      if (pre) { show(pre); pre.scrollIntoView({ block: 'center', inline: 'center' }); }
    }
  }

  // Tracks & Credits: one track (the page reads ?n= and, from a profile, ?c=)
  render.track = function (el, opts) {
    el = mount(el, '');
    var q = new URLSearchParams(location.search);
    var n = (opts && opts.n) || q.get('n'), pre = (opts && opts.c) || q.get('c');
    data().then(function (d) {
      if (!d) return mount(el, '<p class="vn-fog">' + MSG_ERROR + '</p>');
      var t = tracks(d).filter(function (x) { return String(x.n) === String(n); })[0];
      if (!t) return mount(el, '<h1>No track here</h1><p class="vn-fog">This track hasn’t gone out yet, or the link is wrong. <a href="' + esc(C.paths.tracks) + '">All tracks</a></p>');
      document.title = trackNo(t.n) + ', ' + t.title + ': credits | Vela Nox';
      var credits = t.credits; // already in timestamp order; name-only entries carry no time
      var links = (t.links || []).filter(function (l) { return safeUrl(l.url); });
      var names = [], seen = {};
      credits.forEach(function (c) { if (!seen[c.name]) { seen[c.name] = 1; names.push(c.name); } });
      mount(el,
        '<div class="vn-track-head"><div>' +
        '<p class="vn-track-no">' + esc(trackNo(t.n)) + '</p><h1>' + esc(t.title) + '</h1>' +
        '<p class="vn-fog" style="margin:0">Theme: ' + esc(t.theme) + '<br>Sent to subscribers ' + esc(longDate(t.sent, true)) + '<br>' +
        '<span class="vn-num" style="color:var(--mist)">' + plural(t.contributors, 'contributor', 'contributors') + ' · ' + plural(t.cities, 'city', 'cities') + '</span></p>' +
        (links.length
          ? '<div class="vn-links">' + links.map(function (l) { return '<a class="vn-btn-2" href="' + esc(safeUrl(l.url)) + '" rel="noopener" target="_blank">' + esc(l.label || 'Listen') + '</a>'; }).join('') + '</div>'
          : '<p class="vn-fog vn-read" style="margin-top:1.25rem">Not on streaming platforms yet. Tracks go out there about a month after the subscriber email, once the distributor has reviewed everything. Subscribers get an email when it’s out.</p>') +
        '</div>' + cover(t) + '</div>' +
        '<section class="vn-section"><h2>Waveform credits</h2><p class="vn-fog vn-read">Each mark is a sound someone sent. Hover or tap it to see whose. People who chose not to show their city are credited by name only, in the list below.</p><div class="vn-wave-box"><p class="vn-fog">Reading the waveform…</p></div></section>' +
        '<section class="vn-section"><h2>Credits</h2>' + (credits.length
          ? '<ol class="vn-credits">' + credits.map(function (c, i) {
            if (!c.slug) return '<li data-i="' + i + '"><span class="vn-ts"></span><span>' + esc(c.name) + '</span></li>';
            return '<li data-i="' + i + '"><span class="vn-ts">' + esc(c.t) + '</span><span>' + esc(c.sound) + ' · ' +
              '<a href="' + profileUrl(c.slug) + '">' + esc(c.name) + '</a> · <span class="vn-fog">' + esc(c.city) + '</span></span></li>';
          }).join('') + '</ol>'
          : '<p class="vn-fog">No public credits on this track.</p>') + '</section>' +
        '<section class="vn-section"><h2>Streaming credits</h2><p class="vn-fog vn-read">Names only. This is the text used on streaming platforms, where they allow it. The artist field says Vela Nox.</p>' +
        '<p class="vn-stream-credits">' + (names.length ? names.map(esc).join(', ') : '—') + '</p></section>' +
        '<section class="vn-section"><h2>Where this track came from</h2><div class="vn-track-map"></div></section>');

      var waveBox = el.querySelector('.vn-wave-box'), rows = el.querySelector('.vn-credits');
      waveformData(t.waveform).then(function (wf) {
        if (!wf) return (waveBox.innerHTML = '<p class="vn-fog">No waveform for this track. The credits below have every timestamp.</p>');
        drawWave(waveBox, wf, credits, rows, pre);
      });
      var list = credited(d, t.n), mapBox = el.querySelector('.vn-track-map');
      geo().then(function (land) {
        drawMap(mapBox, land, {
          people: list, popups: true, empty: 'No one credited on this track chose to show their city.',
          label: 'Night map with the cities of people credited on ' + trackNo(t.n) + '.'
        });
      }).catch(function () { mapBox.innerHTML = '<p class="vn-fog">' + MSG_ERROR + '</p>'; });
    });
  };

  // Contributor profiles: one card each, opted-in only
  render.contributors = function (el) {
    el = mount(el, '');
    data().then(function (d) {
      if (!d) return mount(el, '<p class="vn-fog">' + MSG_ERROR + '</p>');
      var list = people(d).slice().sort(function (a, b) { return b.credits - a.credits || a.name.localeCompare(b.name); });
      if (!list.length) return mount(el, '<p class="vn-fog">No one here yet. Cards appear once people send sounds and choose to show their city.</p>');
      mount(el, '<div class="vn-grid">' + list.map(card).join('') + '</div>');
      function target() {
        Array.prototype.forEach.call(el.querySelectorAll('.is-target'), function (c) { c.classList.remove('is-target'); });
        var h = decodeURIComponent(location.hash.slice(1)), c = h && document.getElementById(h);
        if (c && el.contains(c)) { c.classList.add('is-target'); c.scrollIntoView({ block: 'center' }); }
      }
      window.addEventListener('hashchange', target);
      target();
    });
  };

  // Submit (inside the subscriber portal). opts.form: GoHighLevel form embed URL.
  render.submit = function (el, opts) {
    el = mount(el, '');
    data().then(function (d) {
      var s = schedule(d && d.settings);
      var intro = strip(s, true);
      if (!s.open) return mount(el, intro);
      mount(el, intro +
        '<p class="vn-reminder">Your sound only. No one else’s voice, no music playing.</p>' +
        '<p class="vn-fog">' + esc(s.voteSubmit) + '</p>' +
        '<div class="vn-form-frame"></div>');
      var frame = el.querySelector('.vn-form-frame');
      if (opts && opts.formHtml) return (frame.innerHTML = opts.formHtml); // preview only
      var src = safeUrl(opts && opts.form);
      if (!src) return (frame.innerHTML = '<p class="vn-fog">Form not connected. Add the GoHighLevel form URL to this element.</p>');
      var f = document.createElement('iframe');
      f.src = src; f.title = 'Send this week’s sound'; f.loading = 'lazy';
      if (opts.formId) f.id = 'inline-' + opts.formId;
      frame.appendChild(f);
      if (!document.querySelector('script[src*="form_embed.js"]')) loadScript('https://link.msgsndr.com/js/form_embed.js').catch(function () {});
    });
  };

  // After a submission: the one centred moment. A light, and a line rising to the tower.
  render.confirmation = function (el) {
    el = mount(el, '');
    data().then(function (d) {
      var s = schedule(d && d.settings);
      mount(el, '<div class="vn-confirm"><div class="vn-confirm-signal" aria-hidden="true"><b></b><i></i></div>' +
        '<h1>Got it. Your sound is in the pool for ' + esc(s.theme) + '.</h1>' +
        '<p>The track lands in your inbox on Monday' + (s.launch ? ', October 12.' : '.') + '</p>' +
        '<p style="margin-top:2rem"><a class="vn-btn-2" href="' + esc(C.paths.map) + '">See the Signal Map</a></p></div>');
    });
  };

  // Second attempt in the same week
  render.alreadySent = function (el) {
    el = mount(el, '');
    data().then(function (d) {
      var s = schedule(d && d.settings);
      mount(el, '<h1>You’ve already sent this week’s sound</h1>' +
        '<p class="vn-read">Your sound is in the pool for ' + esc(s.theme) + '. The track lands in your inbox on Monday' + (s.launch ? ', October 12.' : '.') +
        ' The next theme opens Tuesday.</p>' +
        '<p class="vn-fog vn-read">' + esc(s.voteSubmit) + '</p>');
    });
  };

  // Rules & FAQ: answer to "How does the theme vote work?"
  render.voteAnswer = function (el) {
    var s = schedule();
    mount(el, s.launch
      ? '<p>Launch week is longer. The first vote runs from Wednesday, September 30 until Sunday, October 11, 11:59 pm ET, and decides week 2’s theme. ' +
        'After that, the vote runs all week, Monday to Sunday, closing Sunday at 11:59 pm ET. Each vote decides next week’s theme.</p>' +
        '<p>The vote is a Google Form linked in Vela’s Close Friends story on Instagram and pinned in a Close Friends highlight. The winning theme is announced on Monday, in the story and on this site.</p>'
      : '<p>The vote runs all week, Monday to Sunday, and closes Sunday at 11:59 pm ET. It decides next week’s theme, not this week’s.</p>' +
        '<p>It’s a Google Form linked in Vela’s Close Friends story on Instagram and pinned in a Close Friends highlight. The winning theme is announced on Monday, in the story and on this site.</p>');
  };

  // Rules & FAQ: the current deadline
  render.deadlineAnswer = function (el) {
    var s = schedule();
    mount(el, s.launch
      ? '<p>For Track 01: Thursday, October 8, 11:59 pm ET. From October 12, the regular week applies: submissions open Tuesday at 12:00 am ET and close Thursday at 11:59 pm ET.</p>'
      : '<p>Submissions open Tuesday at 12:00 am ET and close Thursday at 11:59 pm ET, every week.</p>');
  };

  window.VELA = { reset: function () { dataPromise = null; }, config: C, render: render, schedule: schedule, data: data, esc: esc, CTA: CTA, meter: meter };
})();
</script>
<div id="vn-already"></div>
<script>(function go(){if(window.VELA){VELA.render.alreadySent('#vn-already');}else{setTimeout(go,50);}})();</script>
