<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Maker</title>
<!-- Vela Nox cover maker. Open this file in a browser, type the track number, download a 3000 x 3000 PNG
     for the distributor. Same layout as the covers the site draws (src/vela.js, coverArt). -->
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --night: #070C16; --mist: #E6EDF5; --fog: #8E9AAE; --concrete: #243048; }
  body { margin: 0; background: var(--night); color: var(--mist); font-family: 'Atkinson Hyperlegible', Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 16px; }
  h1 { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 36px; margin: 0; }
  label { display: grid; gap: 6px; color: var(--fog); }
  input { font: inherit; color: var(--mist); background: #0D1624; border: 1px solid var(--concrete); padding: 10px 12px; }
  canvas { width: 100%; height: auto; border: 1px solid var(--concrete); }
  button { font: inherit; font-weight: 700; background: var(--mist); color: var(--night); border: 0; padding: 12px 18px; cursor: pointer; justify-self: start; }
  p { color: var(--fog); margin: 0; }
</style>
<main>
  <h1>Cover maker</h1>
  <label>Track number <input id="n" type="number" min="0" value="0"></label>
  <label>Title (for the file name) <input id="t" value="Tumult"></label>
  <canvas id="c" width="3000" height="3000"></canvas>
  <button id="dl" type="button">Download PNG (3000 x 3000)</button>
  <p>Leave the cover image cell in the sheet empty and the site draws this same cover on its own. Use the PNG for the distributor.</p>
</main>
<script>
var MARK = { box: '569 573 912 912', d: 'M727.708,761.335 Q677.558,817.034 651.089,886.618 Q625.4,954.147 624.978,1026.652 Q624.555,1099.157 649.455,1166.981 Q675.112,1236.868 724.61,1293.148 Q774.108,1349.427 840.146,1383.8 Q904.234,1417.157 976.2,1425.998 Q1048.166,1434.838 1118.422,1417.984 Q1190.816,1400.618 1252.464,1357.992 Q1314.111,1315.366 1355.921,1253.766 Q1396.496,1193.986 1413.635,1123.534 Q1430.774,1053.083 1422.194,981.344 Q1413.353,907.423 1378.176,841.242 Q1335.366,760.64 1307.475,745.513 Q1303.677,743.453 1301.516,743.433 Q1300.485,743.423 1298.922,744.44 Q1288.263,751.377 1276.972,780.21 L1022.999,1428.795 L687.922,573 L748.062,573 L1023.001,1275.205 L1224.828,759.79 Q1242.667,714.235 1268.378,697.504 Q1284.101,687.271 1302.027,687.435 Q1318.125,687.582 1334.175,696.287 Q1376.904,719.463 1427.624,814.958 Q1467.714,890.381 1477.798,974.694 Q1487.58,1056.484 1468.048,1136.772 Q1448.516,1217.059 1402.256,1285.216 Q1354.568,1355.475 1284.312,1404.053 Q1214.056,1452.631 1131.485,1472.44 Q1051.385,1491.655 969.372,1481.58 Q887.359,1471.505 814.291,1433.474 Q738.969,1394.269 682.56,1330.131 Q626.15,1265.992 596.886,1186.28 Q568.497,1108.954 568.979,1026.326 Q569.46,943.698 598.748,866.707 Q628.939,787.342 686.092,723.865 Z M807.438,628.294 Q860.214,599.634 918.519,585.629 Q975.891,571.847 1034.928,573.127 Q1093.966,574.406 1150.687,590.659 Q1208.329,607.177 1259.815,638.096 L1230.985,686.104 Q1139.917,631.414 1033.715,629.113 Q927.513,626.812 834.162,677.506 Z M625,573 L625,1472 L569,1472 L569,573 L625,573 Z' };
var c = document.getElementById('c'), x = c.getContext('2d'), S = 3;
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function draw() {
  var n = Math.max(0, parseInt(document.getElementById('n').value, 10) || 0);
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.fillStyle = '#070C16'; x.fillRect(0, 0, 3000, 3000);
  var g = x.createRadialGradient(1500, 1500, 0, 1500, 1500, 1740);
  g.addColorStop(0, 'rgba(230,237,245,0.07)'); g.addColorStop(1, 'rgba(230,237,245,0)');
  x.fillStyle = g; x.fillRect(0, 0, 3000, 3000);
  // the mark, centred
  var b = MARK.box.split(' ').map(Number), m = 440 * S, k = m / b[2];
  x.save(); x.translate(1500 - m / 2, 1500 - m / 2); x.scale(k, k); x.translate(-b[0], -b[1]);
  x.fillStyle = '#E6EDF5'; x.fill(new Path2D(MARK.d)); x.restore();
  // "TRACK 01", small and centred along the bottom (letter-spacing follows the last letter too, so shift by half)
  var ls = 0.4 * 38 * S;
  x.fillStyle = '#8E9AAE'; x.font = '600 ' + 38 * S + 'px "Big Shoulders Display"'; x.letterSpacing = ls + 'px';
  x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.fillText('TRACK ' + pad2(n), 1500 + ls / 2, 915 * S);
}
document.getElementById('n').oninput = document.getElementById('t').oninput = draw;
document.getElementById('dl').onclick = function () {
  var a = document.createElement('a');
  a.download = 'vela-nox-track-' + pad2(parseInt(document.getElementById('n').value, 10) || 0) + '-' + (document.getElementById('t').value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'cover') + '.png';
  a.href = c.toDataURL('image/png'); a.click();
};
draw();
Promise.all([document.fonts.load('600 60px "Big Shoulders Display"'), document.fonts.load('700 20px "Atkinson Hyperlegible"')]).then(draw, draw);
</script>
